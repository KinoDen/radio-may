<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171522">
<title>Радио Май — MAX RADIO</title>
<style>
:root{
 --shell:#211f31;--shell2:#302d42;--edge:#77748e;--edge2:#45445b;
 --screen:#020704;--green:#00ff4c;--green-dim:#7adf91;--green-dark:#092014;
 --muted:#8e9abd;--gold:#d5c27a;--red:#ff343d;--text:#e0e4f5;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090a0f;color:var(--text);font-family:Tahoma,Arial,sans-serif}
body{padding:0}
.app{width:min(100%,470px);margin:0 auto;padding:0 0 12px;background:linear-gradient(180deg,#171522,#242235 35%,#171522);min-height:100vh}
.panel{margin:0 0 9px;border:2px solid #090a10;border-radius:5px;background:linear-gradient(180deg,#333044,#211f30 13%,#29273a 88%,#151421);box-shadow:inset 0 1px #ffffff24,0 2px 4px #000b;padding:3px}
.headline{height:24px;display:flex;align-items:center;justify-content:center;gap:9px;color:#e4d78c;font:bold 10px monospace;letter-spacing:2px;text-shadow:0 0 4px #d9c76b}
.headline:before,.headline:after{content:"";height:4px;flex:1;border-top:1px solid #c9b976;border-bottom:1px solid #59536c}
.squares{display:flex;gap:3px;margin-left:3px}.squares i{width:9px;height:8px;border:1px solid #a4a2b7;display:block}
.top-display{display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;padding:3px 2px 6px}
.station-logo{height:90px;border:2px solid #77758b;border-radius:7px;background:linear-gradient(145deg,#7d1dc1,#551077);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 8px #0009}
.station-logo img{width:100%;height:100%;object-fit:contain;padding:5px;background:#fff}
.station-logo .fallback{font:36px monospace;color:white}
.display-right{min-width:0;display:flex;flex-direction:column;gap:5px}
.clockbox{height:61px;border:2px solid #44465a;border-radius:3px;background:var(--screen);padding:5px 8px;box-shadow:inset 0 0 8px #000}
.clock{font:bold 29px monospace;letter-spacing:2px;color:var(--green);line-height:1.1;text-shadow:0 0 7px #00ff4c99}
.date{font:10px monospace;color:var(--green-dim);margin-top:2px}
.levels{height:45px;border:2px solid #555166;border-radius:3px;background:#030704;padding:3px 4px;display:grid;gap:3px}
.level{display:grid;grid-template-columns:10px 1fr;gap:3px;align-items:center;color:var(--green-dim);font:10px monospace}
.ledrow{display:grid;grid-template-columns:repeat(28,1fr);gap:2px;height:13px}
.ledrow i{background:linear-gradient(90deg,#0b2515,#1b2413);border:1px solid #152719}
.ledrow i.lit{background:#0f4c21;box-shadow:0 0 3px #00ff4c55}
.spectrum{height:75px;background:#030604;border:2px solid #4a4657;border-radius:3px;margin:0 2px 7px;padding:4px;display:flex;align-items:end;gap:2px;overflow:hidden;position:relative}
.spectrum:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 5px,#172018 6px);pointer-events:none}
.spectrum i{z-index:1;flex:1;height:var(--h);background:linear-gradient(to top,#00a72e 0%,#42b900 55%,#c7a900 82%,#d82c13 100%);opacity:.9}
.spectrum.active i{animation:eq .48s ease-in-out infinite alternate}
.spectrum.active i:nth-child(3n){animation-delay:.17s}.spectrum.active i:nth-child(4n){animation-delay:.3s}
@keyframes eq{from{transform:scaleY(.3);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
.nowplaying{margin:0 2px 5px;height:28px;border:2px solid #4d4b60;border-radius:3px;background:#020603;color:var(--green);font:bold 17px monospace;white-space:nowrap;overflow:hidden;padding:3px 5px;text-shadow:0 0 7px #00ff4c99}
.meta{height:23px;display:flex;align-items:center;gap:10px;padding:0 4px;color:#9ba6c5;font:10px monospace}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:0 0 7px var(--red);margin-right:4px}
.meta .live{color:#ff777c}
.controls{height:37px;display:flex;align-items:center;gap:5px;padding:1px 3px 5px}
.key{width:36px;height:27px;border:1px solid #88869c;border-radius:3px;background:linear-gradient(#55536a,#262438);box-shadow:inset 0 1px #ffffff55,0 1px 2px #000;color:#eef0ff;font-size:14px;cursor:pointer;text-shadow:0 1px #000}
.key:active{transform:translateY(1px);background:linear-gradient(#292638,#56536c)}
.volume{margin-left:auto;display:flex;align-items:center;gap:5px;min-width:0}
.volume input{width:100px;max-width:27vw;accent-color:#d8c76e}
.volume span{font:10px monospace;color:#d8c76e}
.status{font:10px monospace;color:#a6b0d1;padding:1px 4px 4px;min-height:17px}
.weather-body{padding:3px}
.city{height:32px;border:2px solid #424458;border-radius:3px;background:var(--screen);color:#8b9ab9;padding:7px 6px;font:10px monospace}
.weather-card{height:78px;margin-top:6px;border:2px solid #48465b;border-radius:3px;background:#030704;display:flex;align-items:center;padding:7px 10px;gap:17px}
.weather-icon{font-size:33px;line-height:1}
.weather-text{font:10px monospace;color:var(--green-dim);line-height:1.6}
.weather-text strong{display:block;font-size:13px;color:var(--green);font-weight:normal}
.playlist-body{padding:4px 3px 3px}
.filters{display:grid;grid-template-columns:1fr 1.08fr;gap:7px;margin-bottom:5px}
.country,.search{height:31px;border:2px solid #424458;border-radius:3px;background:#030704;color:var(--green);padding:5px 7px;font:11px monospace;min-width:0}
.country{appearance:auto}
.search{color:#a8b0ca}
.catalog-note{font:10px monospace;color:#8793b2;min-height:16px;padding:0 0 4px}
.station-list{height:340px;overflow-y:auto;border:1px solid #172d1d;background:#020603;scrollbar-color:#366c45 #11151a;scrollbar-width:thin}
.station{height:51px;display:grid;grid-template-columns:39px minmax(0,1fr) 22px;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px solid #102317;cursor:pointer}
.station:hover{background:#0a2815}
.station.active{background:#103d1f;box-shadow:inset 3px 0 #00e84a}
.station img{width:38px;height:38px;object-fit:contain;border-radius:4px;background:#fff;padding:2px}
.station .fallback{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;color:white;font:bold 20px monospace;background:linear-gradient(135deg,#8e148c,#1d7e35)}
.station-name{font:16px monospace;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.station-desc{font:10px monospace;color:#80bc8e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.star{color:#9397a9;font-size:18px;text-align:center;cursor:pointer}.star.on{color:#f0d45f}
.light{--shell:#d9dce8;--shell2:#f2f3f8;--edge:#858ba0;--screen:#101710;--text:#282c3b;background:#d8dbe5}
.light .app{background:linear-gradient(#e6e8ef,#c4c9d7)}
.light .panel{background:linear-gradient(#f7f8fb,#c4c8d5)}
.light .headline{color:#76611d}
.light .station-list{background:#080d09}
@media(min-width:700px){.app{margin:14px auto;box-shadow:0 8px 35px #0009;border-radius:7px;overflow:hidden}.station-list{height:360px}}
</style>
</head>
<body>
<div class="app">
 <section class="panel">
  <div class="headline">MAX RADIO <span class="squares"><i></i><i></i><i></i></span></div>
  <div class="top-display">
   <div class="station-logo" id="heroLogo"><div class="fallback">RM</div></div>
   <div class="display-right">
    <div class="clockbox"><div class="clock" id="clock">21:59:28</div><div class="date" id="date">Москва ср, 11 нояб.</div></div>
    <div class="levels">
     <div class="level">L <div class="ledrow" id="ledL"></div></div>
     <div class="level">R <div class="ledrow" id="ledR"></div></div>
    </div>
   </div>
  </div>
  <div class="spectrum" id="spectrum"></div>
  <div class="nowplaying" id="nowplaying">▸ Станция не выбрана</div>
  <div class="meta"><span class="live"><i class="dot"></i><span id="liveText">СТАНЦИЯ НЕДОСТУПНА</span></span><span id="quality">VIZ-SIM</span><span style="margin-left:auto">320 kbps · MP3</span></div>
  <div class="controls">
   <button class="key" id="prev" title="Предыдущая">|◀</button>
   <button class="key" id="play" title="Play">▶</button>
   <button class="key" id="pause" title="Пауза">Ⅱ</button>
   <button class="key" id="stop" title="Стоп">■</button>
   <button class="key" id="next" title="Следующая">▶|</button>
   <button class="key" id="mute" title="Звук">◖))</button>
   <label class="volume"><input id="volume" type="range" min="0" max="1" step=".01" value=".8"><span id="volpct">80%</span></label>
  </div>
  <div class="status" id="status">● Выбери станцию из списка</div>
 </section>
 <section class="panel">
  <div class="headline">ПОГОДА · ГОРОД <span class="squares"><i></i><i></i><i></i></span></div>
  <div class="weather-body">
   <input class="city" id="city" value="Воронеж, Россия" aria-label="Город">
   <div class="weather-card"><div class="weather-icon" id="weatherIcon">🌤️</div><div class="weather-text"><strong id="weatherTemp">Погода недоступна</strong><span id="weatherDesc">Подключение к погодному сервису не настроено</span></div></div>
  </div>
 </section>
 <section class="panel">
  <div class="headline">ПЛЕЙЛИСТ <span class="squares"><i></i><i></i><i></i></span></div>
  <div class="playlist-body">
   <div class="filters">
    <select class="country" id="country"><option>Россия</option><option>Все станции</option><option>Великобритания</option><option>США</option><option>Франция</option><option>Германия</option></select>
    <input class="search" id="search" placeholder="⌕ Поиск станции..." autocomplete="off">
   </div>
   <div class="catalog-note" id="catalogNote">Каталог радиостанций</div>
   <div class="station-list" id="stationList"></div>
  </div>
 </section>
</div>
<audio id="audio" preload="none" playsinline></audio>
<script>
const STATIONS=[{"id": 0, "name": "Pioneer FM", "tagline": "Главная станция", "genre": "Избранное", "key": "pioneer", "stream": "", "logoDomain": "pioneerfm.ru"}, {"id": 1, "name": "Zaycev FM", "tagline": "Популярные хиты", "genre": "Поп", "key": "zaycev", "stream": "", "logoDomain": "zaycev.fm"}, {"id": 2, "name": "Record", "tagline": "Танцевальная музыка", "genre": "Dance", "key": "record", "stream": "", "logoDomain": "radiorecord.ru"}, {"id": 3, "name": "Record Russian Mix", "tagline": "Русские танцевальные хиты", "genre": "Dance", "key": "record-russian", "stream": "", "logoDomain": "radiorecord.ru"}, {"id": 4, "name": "Record Супердискотека 90-х", "tagline": "Хиты 90-х", "genre": "Ретро", "key": "record-90", "stream": "", "logoDomain": "radiorecord.ru"}, {"id": 5, "name": "Record Rock", "tagline": "Рок-музыка", "genre": "Rock", "key": "record-rock", "stream": "", "logoDomain": "radiorecord.ru"}, {"id": 6, "name": "Record Chill-Out", "tagline": "Спокойная электронная музыка", "genre": "Chill", "key": "record-chill", "stream": "", "logoDomain": "radiorecord.ru"}, {"id": 7, "name": "Record Deep", "tagline": "Deep house", "genre": "House", "key": "record-deep", "stream": "", "logoDomain": "radiorecord.ru"}, {"id": 8, "name": "Record Trancemission", "tagline": "Транс", "genre": "Electronic", "key": "record-trance", "stream": "", "logoDomain": "radiorecord.ru"}, {"id": 9, "name": "Радио MAXIMUM", "tagline": "Рок без компромиссов", "genre": "Rock", "key": "maximum", "stream": "", "logoDomain": "maximum.ru"}, {"id": 10, "name": "Comedy Radio", "tagline": "Юмор и музыка", "genre": "Разное", "key": "comedy", "stream": "", "logoDomain": "comedy radio.ru"}, {"id": 11, "name": "Маруся FM", "tagline": "Современные хиты", "genre": "Поп", "key": "marusya", "stream": "", "logoDomain": "marus.fm"}, {"id": 12, "name": "Европа Плюс", "tagline": "Современные хиты", "genre": "Поп", "key": "europa", "stream": "", "logoDomain": "europaplus.ru"}, {"id": 13, "name": "DFM", "tagline": "Танцевальная музыка", "genre": "Dance", "key": "dfm", "stream": "", "logoDomain": "dfm.ru"}, {"id": 14, "name": "Радио ENERGY", "tagline": "Главные мировые хиты", "genre": "Поп", "key": "energy", "stream": "", "logoDomain": "nrj.ru"}, {"id": 15, "name": "Новое Радио", "tagline": "Русские хиты", "genre": "Поп", "key": "newradio", "stream": "", "logoDomain": "newradio.ru"}, {"id": 16, "name": "Авторадио", "tagline": "Музыка в дорогу", "genre": "В дороге", "key": "autoradio", "stream": "", "logoDomain": "avtoradio.ru"}, {"id": 17, "name": "Ретро FM", "tagline": "Хиты 70-х, 80-х и 90-х", "genre": "Ретро", "key": "retro", "stream": "", "logoDomain": "retrofm.ru"}, {"id": 18, "name": "Наше Радио", "tagline": "Русский рок", "genre": "Rock", "key": "nashe", "stream": "", "logoDomain": "nashe.ru"}, {"id": 19, "name": "Love Radio", "tagline": "Поп и романтика", "genre": "Поп", "key": "love", "stream": "", "logoDomain": "loveradio.ru"}, {"id": 20, "name": "Дорожное радио", "tagline": "Музыка для поездок", "genre": "В дороге", "key": "dorozhnoe", "stream": "", "logoDomain": "dorognoe.ru"}, {"id": 21, "name": "Радио Монте-Карло", "tagline": "Лаунж и классика", "genre": "Chill", "key": "montecarlo", "stream": "", "logoDomain": "montecarlo.ru"}];
const $=s=>document.querySelector(s),audio=$("#audio");
let selected=null,playing=false,favorites=new Set(JSON.parse(localStorage.getItem("radioMayFavs")||"[]"));
function favicon(s){return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(s.logoDomain||"radio.ru")}&sz=128`}
function makeLedRow(id){for(let i=0;i<28;i++){let x=document.createElement("i");$(id).append(x)}}
makeLedRow("#ledL");makeLedRow("#ledR");
for(let i=0;i<48;i++){let x=document.createElement("i");x.style.setProperty("--h",(8+Math.random()*65)+"%");$("#spectrum").append(x)}
function updateClock(){let d=new Date();$("#clock").textContent=d.toLocaleTimeString("ru-RU",{hour12:false});$("#date").textContent=$("#city").value.split(",")[0]+" · "+d.toLocaleDateString("ru-RU",{weekday:"short",day:"2-digit",month:"short"})}
setInterval(updateClock,1000);updateClock();
function render(){
 let q=$("#search").value.trim().toLowerCase(),list=$("#stationList");list.innerHTML="";
 let items=STATIONS.filter(s=>(!q||(s.name+" "+s.tagline+" "+s.genre).toLowerCase().includes(q)));
 items.forEach(s=>{
  let row=document.createElement("div");row.className="station"+(selected&&selected.id===s.id?" active":"");
  let img=document.createElement("img");img.src=favicon(s);img.alt=s.name;img.onerror=()=>{let f=document.createElement("div");f.className="fallback";f.textContent=s.name.slice(0,1).toUpperCase();img.replaceWith(f)};
  let txt=document.createElement("div"),name=document.createElement("div"),desc=document.createElement("div");
  name.className="station-name";name.textContent=s.name;desc.className="station-desc";desc.textContent="Россия · "+(s.tagline||s.genre||"Интернет-радио");txt.append(name,desc);
  let star=document.createElement("div");star.className="star"+(favorites.has(s.id)?" on":"");star.textContent=favorites.has(s.id)?"★":"☆";
  star.onclick=e=>{e.stopPropagation();favorites.has(s.id)?favorites.delete(s.id):favorites.add(s.id);localStorage.setItem("radioMayFavs",JSON.stringify([...favorites]));render()};
  row.append(img,txt,star);row.onclick=()=>selectStation(s);list.append(row);
 });
 $("#catalogNote").textContent=`${items.length} радиостанций · выбери станцию для прослушивания`;
}
function selectStation(s){
 selected=s;$("#nowplaying").textContent="▸ "+s.name+" — "+(s.tagline||s.genre);
 let box=$("#heroLogo");box.innerHTML="";let img=document.createElement("img");img.src=favicon(s);img.alt=s.name;img.onerror=()=>{box.innerHTML='<div class="fallback">'+s.name.slice(0,1).toUpperCase()+'</div>'};box.append(img);
 $("#status").textContent=s.stream?"Станция выбрана. Нажми Play.":"Поток этой станции пока не подключён.";
 $("#liveText").textContent=s.stream?"ГОТОВА К ЭФИРУ":"СТАНЦИЯ НЕДОСТУПНА";
 render();
}
function meter(active){
 playing=active;$("#spectrum").classList.toggle("active",active);
 ["#ledL","#ledR"].forEach(id=>[...$(id).children].forEach((x,i)=>x.classList.toggle("lit",active&&i<7+Math.floor(Math.random()*12))));
}
function play(){
 if(!selected){$("#status").textContent="Сначала выбери радиостанцию.";return}
 if(!selected.stream){$("#status").textContent="Станция выбрана, но проверенный аудиопоток ещё не добавлен.";return}
 if(audio.src!==selected.stream){audio.src=selected.stream;audio.load()}
 audio.play().then(()=>{meter(true);$("#liveText").textContent="В ЭФИРЕ"}).catch(()=>{$("#status").textContent="Не удалось подключиться к потоку."});
}
$("#play").onclick=play;$("#pause").onclick=()=>{audio.pause();meter(false);$("#liveText").textContent="ПАУЗА"};
$("#stop").onclick=()=>{audio.pause();audio.removeAttribute("src");audio.load();meter(false);$("#liveText").textContent="ОСТАНОВЛЕНО"};
function step(n){let i=selected?STATIONS.findIndex(s=>s.id===selected.id):-1;i=(i+n+STATIONS.length)%STATIONS.length;selectStation(STATIONS[i])}
$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
$("#volume").oninput=e=>{audio.volume=+e.target.value;$("#volpct").textContent=Math.round(audio.volume*100)+"%"};
$("#mute").onclick=()=>{audio.muted=!audio.muted;$("#mute").textContent=audio.muted?"×":"◖))"};
$("#search").oninput=render;
$("#city").onchange=updateClock;
audio.addEventListener("playing",()=>{meter(true);$("#liveText").textContent="В ЭФИРЕ"});
audio.addEventListener("error",()=>{meter(false);$("#liveText").textContent="ОШИБКА ПОТОКА"});
setInterval(()=>{if(playing){["#ledL","#ledR"].forEach(id=>[...$(id).children].forEach((x,i)=>x.classList.toggle("lit",i<5+Math.floor(Math.random()*20))))}},160);
render();
</script>
</body></html>
