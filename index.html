<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111315">
<title>Радио Май — Hi-Fi Edition</title>
<style>
:root{
 --bg:#090b0d;--case:#202428;--case2:#111518;--well:#050708;--edge:#778087;--edge2:#3e464c;
 --txt:#f4f2ee;--muted:#aab2b8;--gold:#ff9f19;--gold2:#ffd36b;--orange:#ef6a13;
 --green:#42df27;--yellow:#ffe12d;--red:#f12b22;--row:#171c20;--rowhi:#2a3035;
 --shadow:0 8px 22px #000b;--glass:#ffffff0b
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--txt);background:radial-gradient(ellipse at 50% -20%,#353a3e 0,#161a1d 46%,#07090b 100%)}
body{padding:8px}
button,input{font:inherit}button{color:inherit;cursor:pointer}
.app{width:min(100%,1660px);margin:auto}
.metal{border:1px solid var(--edge);border-radius:15px;background:linear-gradient(145deg,#555b60 0,#2b3034 5%,#15191c 25%,#202529 72%,#080a0c 100%);box-shadow:inset 0 1px 1px #fff8,inset 0 -2px 3px #000d,var(--shadow);position:relative}
.metal:after{content:"";pointer-events:none;position:absolute;inset:2px;border-radius:12px;background:repeating-linear-gradient(0deg,#fff00000 0 2px,#ffffff05 2px 3px);opacity:.32}
.top{height:74px;display:flex;align-items:center;gap:16px;padding:7px 18px;margin-bottom:10px}
.brand{font:italic 700 clamp(26px,3vw,42px) Georgia,serif;white-space:nowrap;text-shadow:0 2px 2px #000}
.brand em{font-style:normal;color:var(--gold)}
.brand small{display:block;font:9px Arial;letter-spacing:2px;color:#c6cbd0;margin-top:-1px}
.ecg{width:72px;height:34px;flex:none}
.ecg path{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #ff9d16);stroke-dasharray:140;animation:trace 2.3s linear infinite}
@keyframes trace{to{stroke-dashoffset:-140}}
.divider{height:36px;width:1px;background:linear-gradient(transparent,#aab0b5,transparent)}
.toplabel{font-size:16px;white-space:nowrap}
.meta{margin-left:auto;display:flex;align-items:center;gap:7px}
.metabox,.themebtn,.infobtn{height:42px;border:1px solid #697279;border-radius:10px;background:linear-gradient(#343a3f,#111518);box-shadow:inset 0 1px #fff4,0 2px 4px #0009;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:13px}
.clock{font:20px "Courier New",monospace;letter-spacing:1px}
.clock small{display:block;font:9px Arial;color:var(--muted);letter-spacing:0}
.themebtn{padding:0 5px;gap:2px}.themebtn button{height:32px;width:34px;border:0;border-radius:7px;background:transparent;color:#bdc4c9}.themebtn button.active{background:linear-gradient(#ffc45a,#a95c08);color:#17100a;box-shadow:0 0 10px #ff9e1d88}
.main{display:grid;grid-template-columns:minmax(0,2.12fr) minmax(390px,1fr);gap:10px}
.left,.right{padding:12px;min-width:0}
.hero{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:center;padding:7px 7px 12px;min-height:205px}
.station-art{width:245px;height:184px;border:2px solid #778087;border-radius:17px;background:linear-gradient(145deg,#353b40,#080a0c 60%,#20262a);box-shadow:inset 0 0 0 5px #080a0c,inset 0 0 0 7px #747d83,0 4px 9px #000c;display:grid;place-items:center;overflow:hidden;position:relative}
.station-art:before{content:"";position:absolute;inset:12px;border:1px solid #ffffff30;border-radius:11px}
.station-art img{max-width:86%;max-height:78%;object-fit:contain;filter:drop-shadow(0 3px 5px #000);z-index:1}
.station-art .fallback{font-size:58px;font-weight:900;letter-spacing:-4px;text-shadow:0 3px 5px #000}
.hero-info{min-width:0}
.station-title{font-size:clamp(25px,2.7vw,39px);font-weight:800;line-height:1.05;margin-bottom:7px}
.station-sub{font-size:clamp(16px,1.7vw,22px);color:#d5d9dc;margin-bottom:15px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid #7c858b;border-radius:20px;padding:7px 13px;background:linear-gradient(#444b50,#171c20);box-shadow:inset 0 1px #fff5,0 2px 3px #0008;font-size:12px}
.live{margin-left:auto;color:#ff3832;border-color:#a32620;box-shadow:0 0 12px #f22a2a55}
.trackline{display:flex;align-items:center;gap:10px;margin-top:13px;color:#e8e8e8;font:12px "Courier New",monospace}
.progress{height:8px;border-radius:10px;background:#030405;border:1px solid #5c656b;flex:1;box-shadow:inset 0 2px 4px #000}
.visuals{display:grid;grid-template-columns:1fr 1fr 2fr;gap:9px;margin:0 0 10px}
.instrument{height:166px;border:1px solid #788188;border-radius:12px;background:linear-gradient(145deg,#343a3e,#101416 55%,#050708);box-shadow:inset 0 1px #fff5,inset 0 -3px 5px #000d,0 2px 5px #0008;padding:8px;position:relative;overflow:hidden}
.instrument:before{content:"";position:absolute;inset:3px;border:1px solid #ffffff18;border-radius:9px;pointer-events:none}
.inst-label{font: bold 10px Georgia,serif;letter-spacing:1.4px;color:var(--gold2);text-align:center;margin-bottom:4px}
.vu-svg{width:100%;height:128px;display:block}
.needle{transform-origin:150px 106px;transform:rotate(-24deg);transition:transform .12s linear;filter:drop-shadow(0 0 3px #ffb22b)}
.spectrum{height:166px;padding:8px 10px 7px}
.spectrum-head{display:flex;justify-content:space-between;font: bold 10px Georgia,serif;letter-spacing:1.5px;color:var(--gold2);margin:0 3px 7px}
.bars{height:125px;display:flex;align-items:end;gap:3px;padding:5px 3px 0;border-bottom:2px solid #a77a21;background:repeating-linear-gradient(0deg,#080a0b 0 14px,#ffffff0d 14px 15px)}
.bar{flex:1;min-width:2px;height:var(--h,12%);border-radius:2px 2px 0 0;background:linear-gradient(to top,var(--green) 0 42%,var(--yellow) 57%,#ff8b12 78%,var(--red) 100%);box-shadow:0 0 5px #76e72b55;transition:height .18s ease}
.controls{height:82px;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;border:1px solid #778087;border-radius:12px;background:linear-gradient(180deg,#454b50,#252b2f 45%,#101416);box-shadow:inset 0 1px #fff7,inset 0 -2px 3px #000b}
.control{height:54px;min-width:57px;border:1px solid #a5adb2;border-radius:9px;background:linear-gradient(145deg,#f0f2f3 0,#8e989e 18%,#465057 50%,#b8c0c5 100%);color:#101518;text-shadow:0 1px #fff8;font-size:20px;font-weight:900;box-shadow:inset 0 1px 2px #fff, inset 0 -3px 4px #0007,0 3px 4px #000b;position:relative}
.control:active{transform:translateY(2px);box-shadow:inset 0 3px 6px #0008}
.control.play{height:66px;min-width:66px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#ffe7a5,#ffae25 48%,#a44a00 100%);border:2px solid #ffcf72;box-shadow:0 0 0 3px #4d2a08,0 0 18px #ff9b20,inset 0 2px 3px #fff}
.control.small{min-width:47px;height:48px;font-size:17px}
.volume{display:flex;align-items:center;gap:8px;margin-left:14px;font-size:12px}
.volume input{width:115px;accent-color:var(--gold)}
.volval{min-width:32px}
.hint{text-align:center;color:#aab1b6;font-size:10px;margin:7px 0 0}
.right{display:flex;flex-direction:column;min-height:740px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:9px}
.tab{height:43px;border:1px solid #778087;border-radius:9px;background:linear-gradient(#41484d,#171c20);box-shadow:inset 0 1px #fff5,0 2px 3px #0009;font-size:13px}
.tab.active{background:linear-gradient(#ffd06b,#d57b0c 55%,#8b4500);color:#1b1309;border-color:#ffca66;box-shadow:0 0 10px #ff9d1e66,inset 0 1px #fff}
.search{height:42px;border:1px solid #7b858b;border-radius:8px;background:#050708;color:#fff;padding:0 13px;margin-bottom:9px;outline:none}
.search:focus{border-color:var(--gold);box-shadow:0 0 0 2px #ff9f1933}
.station-list{overflow:auto;min-height:0;max-height:calc(100vh - 230px);padding-right:4px;scrollbar-color:#8b969c #15191c;scrollbar-width:thin}
.station-row{width:100%;min-height:61px;display:grid;grid-template-columns:92px minmax(0,1fr) 28px 30px;align-items:center;gap:10px;padding:5px 8px;margin-bottom:5px;text-align:left;border:1px solid #4c555b;border-radius:8px;background:linear-gradient(100deg,#30363a,#171c20 55%,#0d1012);box-shadow:inset 0 1px #ffffff12,0 2px 3px #0008}
.station-row:hover{border-color:#d99a39;background:linear-gradient(100deg,#494039,#252a2d)}
.station-row.active{border:1px solid #ffb83d;background:linear-gradient(100deg,#68400d,#302313 50%,#17130d);box-shadow:inset 0 0 0 1px #ffcf5a55,0 0 9px #ff9d1e44}
.logo{width:88px;height:45px;border-radius:5px;background:#050607;display:grid;place-items:center;overflow:hidden;border:1px solid #6d767c}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:2px}
.logo b{font-size:15px;color:#fff;text-align:center}
.station-copy{min-width:0}
.station-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.station-tag{font-size:11px;color:#b9c0c5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.country{font:9px "Courier New",monospace;color:#aeb6bb;text-align:center}
.fav{border:0;background:transparent;color:#c3cbd0;font-size:20px;padding:3px}
.fav.on{color:#ffb83d;text-shadow:0 0 8px #ff9f19}
.empty{color:#9ca6ad;text-align:center;padding:35px 10px}
.bottom-country{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;padding:9px;border:1px solid #697279;border-radius:10px;background:linear-gradient(#33393d,#14181b)}
.countrybtn{border:1px solid #6d777e;border-radius:7px;padding:8px 12px;background:linear-gradient(#3d4449,#171c20);font-size:12px}
.countrybtn.active{background:linear-gradient(#ffd06b,#b76a0a);color:#1a1208;border-color:#ffd06b}
body[data-theme="light"]{--bg:#d9dde0;--case:#d8dcdf;--case2:#c3c9cd;--well:#252a2d;--txt:#15191c;--muted:#5e686e;--row:#e1e5e7;--rowhi:#f5f6f7;background:radial-gradient(ellipse at 50% -20%,#fff 0,#cbd1d5 48%,#929ba1 100%);color:#171b1e}
body[data-theme="light"] .metal{background:linear-gradient(145deg,#fff 0,#d9dee1 8%,#aeb7bd 30%,#e7eaec 70%,#8c969d 100%);border-color:#737d84}
body[data-theme="light"] .toplabel,body[data-theme="light"] .station-sub{color:#30383d}
body[data-theme="light"] .metabox,body[data-theme="light"] .themebtn,body[data-theme="light"] .infobtn{background:linear-gradient(#fff,#aeb8be);color:#172026;border-color:#77838a}
body[data-theme="light"] .instrument{background:linear-gradient(145deg,#f8f9f9,#b7c0c5 60%,#e5e8e9)}
body[data-theme="light"] .controls{background:linear-gradient(#eef1f2,#b5bec3 50%,#8d999f)}
body[data-theme="light"] .station-row{background:linear-gradient(100deg,#f5f6f6,#d5dadd 55%,#bfc7cc);color:#161b1f}
body[data-theme="light"] .station-row.active{background:linear-gradient(100deg,#ffe1a0,#eab85e 55%,#c48a35)}
body[data-theme="light"] .station-tag,body[data-theme="light"] .country{color:#4c565d}
body[data-theme="light"] .tab,body[data-theme="light"] .countrybtn{background:linear-gradient(#f8f9f9,#aeb8be);color:#1b2227}
body[data-theme="light"] .tab.active,body[data-theme="light"] .countrybtn.active{background:linear-gradient(#ffd06b,#c47a17);color:#241708}
body[data-theme="light"] .search{background:#f8f9f9;color:#15191c}
body[data-theme="light"] .bottom-country{background:linear-gradient(#f0f2f3,#b3bdc2)}
@media(max-width:1000px){.main{grid-template-columns:1fr}.right{min-height:550px}.station-list{max-height:560px}.hero{grid-template-columns:190px 1fr}.station-art{width:180px;height:155px}.visuals{grid-template-columns:1fr 1fr}.spectrum{grid-column:1/-1}}
@media(max-width:600px){body{padding:4px}.top{height:auto;min-height:65px;gap:8px;padding:7px}.brand{font-size:25px}.ecg,.divider,.toplabel{display:none}.meta{gap:4px}.metabox{padding:0 6px;height:36px;font-size:10px}.clock{font-size:14px}.themebtn{height:36px}.main{gap:6px}.left,.right{padding:7px}.hero{grid-template-columns:100px 1fr;gap:10px;min-height:130px}.station-art{width:98px;height:110px}.station-art .fallback{font-size:34px}.station-title{font-size:22px}.station-sub{font-size:14px;margin-bottom:8px}.pill{font-size:10px;padding:5px 8px}.trackline{margin-top:7px}.visuals{grid-template-columns:1fr 1fr;gap:5px}.instrument{height:135px;padding:5px}.vu-svg{height:103px}.spectrum{grid-column:1/-1;height:135px}.bars{height:96px}.controls{gap:5px;height:72px}.control{min-width:43px;height:45px}.control.play{min-width:54px;height:54px}.control.small{min-width:38px;height:40px}.volume{margin-left:3px;gap:3px}.volume input{width:65px}.station-row{grid-template-columns:64px minmax(0,1fr) 22px 24px;gap:6px;min-height:54px}.logo{width:62px;height:38px}.station-name{font-size:12px}.station-tag{font-size:10px}.country{display:none}.tabs .tab{font-size:11px}.right{min-height:450px}}
</style>
</head>

<div class="app">

 </div>

id": "franceinter", "name": "France Inter", "tagline": "Actualité, culture et musique", "genre": "Новости / Разное", "country": "Франция", "flag": "🇫🇷", "domain": "radiofrance.fr", "stream": "https://icecast.radiofrance.fr/franceinter-midfi.mp3"}, {"id": "deutschlandfunk", "name": "Deutschlandfunk", "tagline": "Nachrichten und Hintergrund", "genre": "Новости", "country": "Германия", "flag": "🇩🇪", "domain": "deutschlandfunk.de", "stream": "https://st01.sslstream.dlf.de/dlf/01/128/mp3/stream.mp3"}];
const $=s=>document.querySelector(s);
const audio=$("#audio");
let current=-1, tab="stations", country="Все страны", favorites=new Set(JSON.parse(localStorage.getItem("radioMayFavs")||"[]")), recent=JSON.parse(localStorage.getItem("radioMayRecent")||"[]"), hls=null, ctx=null, analyser=null, dataArray=null, raf=0;
const bars=$("#bars");
for(let i=0;i<48;i++){const b=document.createElement("i");b.className="bar";b.style.setProperty("--h","2%");bars.appendChild(b)}
function logoUrl(s){return "https://www.google.com/s2/favicons?domain="+encodeURIComponent(s.logo||"")+"&sz=128"}
function fallback(s){return (s.short||s.name.replace(/[^A-Za-zА-Яа-я0-9]/g,"").slice(0,3)||"FM").toUpperCase()}
function setLogo(container,s,small=false){
 container.innerHTML="";
 const img=document.createElement("img");img.src=logoUrl(s);img.alt=s.name;img.loading="lazy";
 img.onerror=()=>{container.innerHTML='<b>'+fallback(s)+'</b>'};
 container.appendChild(img);
}
function render(){
 const list=$("#stationList");list.innerHTML="";
 let items=STATIONS.map((s,i)=>({...s,_i:i}));
 if(tab==="favorites")items=items.filter(s=>favorites.has(s.id));
 if(tab==="recent")items=items.filter(s=>recent.includes(s.id)).sort((a,b)=>recent.indexOf(a.id)-recent.indexOf(b.id));
 if(country!=="Все страны")items=items.filter(s=>s.country===country);
 const q=$("#search").value.trim().toLowerCase();
 if(q)items=items.filter(s=>(s.name+" "+s.tagline+" "+s.genre+" "+s.country).toLowerCase().includes(q));
 if(!items.length){list.innerHTML='<div class="empty">Станции не найдены</div>';return}
 items.forEach(s=>{
  const row=document.createElement("button");row.className="station-row"+(s._i===current?" active":"");row.type="button";
  const logo=document.createElement("div");logo.className="logo";setLogo(logo,s,true);
  const copy=document.createElement("div");copy.className="station-copy";copy.innerHTML='<div class="station-name"></div><div class="station-tag"></div>';copy.querySelector(".station-name").textContent=s.name;copy.querySelector(".station-tag").textContent=s.tagline||s.genre||"";
  const c=document.createElement("div");c.className="country";c.textContent=(s.country||"").slice(0,2).toUpperCase();
  const fav=document.createElement("button");fav.type="button";fav.className="fav"+(favorites.has(s.id)?" on":"");fav.textContent=favorites.has(s.id)?"★":"☆";fav.title="Избранное";
  fav.onclick=e=>{e.stopPropagation();toggleFav(s.id)};
  row.append(logo,copy,c,fav);row.onclick=()=>selectStation(s._i,true);list.appendChild(row);
 });
}
function toggleFav(id){if(favorites.has(id))favorites.delete(id);else favorites.add(id);localStorage.setItem("radioMayFavs",JSON.stringify([...favorites]));render();updateFavCurrent()}
function updateFavCurrent(){const s=STATIONS[current];$("#favCurrent").textContent=s&&favorites.has(s.id)?"★":"☆"}
function selectStation(i,autoplay=false){
 current=i;const s=STATIONS[i];$("#heroName").textContent=s.name;$("#heroTag").textContent=s.tagline||s.genre||"Интернет-радио";setLogo($("#heroArt"),s);$("#liveState").textContent="● READY";$("#hint").textContent="Станция выбрана. Нажми Play для воспроизведения.";updateFavCurrent();render();if(autoplay)play();
}
function stop(){audio.pause();if(hls){hls.destroy();hls=null}$("#playBtn").textContent="▶";$("#liveState").textContent="● READY";$("#specStatus").textContent="48 BAND · STANDBY";$("#hint").textContent="Воспроизведение остановлено.";cancelAnimationFrame(raf);animateIdle()}
function play(){
 if(current<0){selectStation(0,false)}
 const s=STATIONS[current];if(!s||!s.stream){$("#hint").textContent="Для этой станции пока нет адреса потока.";return}
 if(hls){hls.destroy();hls=null}
 audio.pause();audio.src="";
 const url=s.stream;
 if(url.includes(".m3u8")&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(audio)}
 else{audio.src=url}
 audio.volume=Number($("#volume").value);
 audio.play().then(()=>{$("#playBtn").textContent="Ⅱ";$("#liveState").textContent="● LIVE";$("#specStatus").textContent="48 BAND · ON AIR";$("#hint").textContent="Эфир подключён: "+s.name;recent=[s.id,...recent.filter(x=>x!==s.id)].slice(0,12);localStorage.setItem("radioMayRecent",JSON.stringify(recent));render();startVisuals()}).catch(e=>{$("#hint").textContent="Не удалось подключиться к потоку. Попробуй другую станцию или проверь доступность эфира.";$("#liveState").textContent="● ERROR";});
}
function startVisuals(){
 if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();const src=ctx.createMediaElementSource(audio);analyser=ctx.createAnalyser();analyser.fftSize=128;src.connect(analyser);analyser.connect(ctx.destination);dataArray=new Uint8Array(analyser.frequencyBinCount)}catch(e){ctx=null}}
 if(ctx&&ctx.state==="suspended")ctx.resume();
 cancelAnimationFrame(raf);
 const els=[...bars.children];
 function draw(){
  let vals=[];
  if(analyser){analyser.getByteFrequencyData(dataArray);for(let i=0;i<48;i++){const v=dataArray[Math.min(dataArray.length-1,Math.floor(i*dataArray.length/48))]/255;vals.push(v)}} 
  else{for(let i=0;i<48;i++)vals.push(.12+Math.random()*.65)}
  els.forEach((b,i)=>b.style.height=Math.max(2,vals[i]*100)+"%");
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  $("#needleL").style.transform=`rotate(${-38+avg*76}deg)`;$("#needleR").style.transform=`rotate(${-32+avg*66}deg)`;
  raf=requestAnimationFrame(draw);
 }
 draw();
}
function animateIdle(){const els=[...bars.children];els.forEach(b=>b.style.height="2%");$("#needleL").style.transform="rotate(-24deg)";$("#needleR").style.transform="rotate(-24deg)"}

audio.onplaying=()=>{$("#playBtn").textContent="Ⅱ";$("#liveState").textContent="● LIVE"};

$("#nextBtn").onclick=()=>selectStation((current+1)%STATIONS.length,true);

$("#volume").oninput=e=>{audio.volume=Number(e.target.value);$("#volVal").textContent=Math.round(e.target.value*100)+"%"};
$("#favCurrent").onclick=()=>{if(current>=0)toggleFav(STATIONS[current].id)};
$("#listBtn").onclick=()=>$("#search").focus();
$("#search").oninput=render;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll(".countrybtn").forEach(b=>b.onclick=()=>{country=b.dataset.country;document.querySelectorAll(".countrybtn").forEach(x=>x.classList.toggle("active",x===b));tab="stations";document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab==="stations"));render()});
function setTheme(t){document.body.dataset.theme=t;$("#darkBtn").classList.toggle("active",t==="dark");$("#lightBtn").classList.toggle("active",t==="light");localStorage.setItem("radioMayTheme",t)}
$("#darkBtn").onclick=()=>setTheme("dark");$("#lightBtn").onclick=()=>setTheme("light");setTheme(localStorage.getItem("radioMayTheme")||"dark");
function tick(){const d=new Date();$("#clock").textContent=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});$("#date").textContent=d.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"short"}).toUpperCase()}
tick();setInterval(tick,1000);
$("#infoBtn").onclick=()=>alert("Радио Май — интернет-радио. Доступность потоков зависит от вещателя и региона.");
$("#city").onclick=()=>{const c=prompt("Город для погоды:", "Воронеж");if(c)$("#city").textContent=c};
$("#weather").textContent="обновляется";
