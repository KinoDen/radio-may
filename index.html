<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111315">
<title>Радио Май — интернет-радио</title>
<style>
:root{color-scheme:dark;--bg:#080a0d;--metal:#171a1d;--metal2:#24282c;--well:#050607;--line:#687078;--text:#f4f5f6;--muted:#aeb5bb;--gold:#ff9f16;--gold2:#ffd16a;--row:#171b1f;--row2:#252a2f;--green:#70e33e;--red:#ff332b;--shadow:#000b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(ellipse at 48% -20%,#34383b 0,#15181b 44%,#07090b 100%)}
body{padding:8px}button,input{font:inherit}button{color:inherit;cursor:pointer}
.app{width:min(100%,1700px);margin:0 auto}
.metal{border:1px solid #737b80;border-radius:15px;background:linear-gradient(155deg,#464b4f 0%,#25292d 10%,#111416 54%,#2c3135 100%);box-shadow:inset 0 1px 1px #fff8,inset 0 -2px 2px #000d,0 5px 15px #0009}
.top{height:74px;display:flex;align-items:center;gap:18px;padding:8px 18px;overflow:hidden}
.brandmark{display:flex;align-items:center;gap:15px;min-width:0}
.brand{font:italic 700 clamp(24px,3vw,43px) Georgia,serif;white-space:nowrap;text-shadow:0 2px 2px #000}
.brand:after{content:"";display:block;height:3px;width:88%;margin:0 auto;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 7px var(--gold)}
.brandstack{display:flex;flex-direction:column}.brand small{font:9px Arial;letter-spacing:2px;color:#c1c6ca;margin-top:3px}
.brandicon{color:var(--gold);font-size:35px;text-shadow:0 0 10px #ff9d16}
.ecg{width:72px;height:34px;flex:none}.ecg path{fill:none;stroke:#ffb12b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px #ff9d16);stroke-dasharray:140;animation:trace 2.2s linear infinite}
@keyframes trace{to{stroke-dashoffset:-140}}
.topdivider{height:36px;width:1px;background:linear-gradient(transparent,#92999d,transparent)}
.toplabel{font-size:clamp(12px,1.5vw,20px);white-space:nowrap;color:#e1e4e6}
.topmeta{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.meta{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #596167;border-radius:9px;background:linear-gradient(#30363a,#101315);box-shadow:inset 0 1px #fff3,0 2px 4px #0008;white-space:nowrap}
.meta .big{font:700 clamp(15px,2vw,25px) "Courier New",monospace}.meta small{display:block;font-size:9px;color:#adb5ba;text-align:center;margin-top:1px}
.weather{font-size:13px;cursor:pointer}.weather .wx{font-size:23px}
.theme{display:flex;padding:3px;border:1px solid #667077;border-radius:9px;background:#090b0d}
.theme button{width:42px;height:38px;border:0;border-radius:6px;background:transparent;color:#bac0c4;font-size:20px}
.theme button.active{background:linear-gradient(#ffd36c,#b8670d);color:#fff;box-shadow:0 0 12px #ff9d1677,inset 0 1px #fff9}
.windowbtn{width:43px;height:40px;border:1px solid #737b80;border-radius:8px;background:linear-gradient(#41474b,#101315);font-size:22px;box-shadow:inset 0 1px #fff4,0 2px 4px #0008}
.workspace{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(490px,1fr);gap:10px;margin-top:10px;align-items:stretch}
.player{padding:12px;display:flex;flex-direction:column;gap:9px;min-width:0}
.now{display:grid;grid-template-columns:260px minmax(0,1fr);gap:17px;align-items:center;padding:4px 7px 7px}
.cover{height:202px;border-radius:18px;border:2px solid #8a9297;background:radial-gradient(circle at 50% 30%,#4b5054,#07090b 75%);box-shadow:inset 0 0 0 5px #080a0c,inset 0 1px #fff8,0 3px 12px #000c;display:grid;place-items:center;overflow:hidden;position:relative}
.cover:before{content:"";position:absolute;inset:7px;border:1px solid #d6dadd66;border-radius:12px;pointer-events:none}
.cover img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 4px 6px #000d);position:relative;z-index:1}
.cover .fallback{font-weight:900;font-size:58px;letter-spacing:-5px;text-shadow:0 2px 8px #000}
.track{min-width:0}
.trackname{font-size:clamp(25px,3vw,43px);font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 4px #000b}
.tracktag{font-size:clamp(15px,1.6vw,23px);color:#cbd0d3;margin-top:3px}
.badges{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:18px}
.badge{border:1px solid #70797f;border-radius:24px;padding:8px 15px;background:linear-gradient(#343a3e,#111416);box-shadow:inset 0 1px #fff5,0 2px 4px #0008;font-size:14px}
.badge.live{margin-left:auto;color:#ff443d;border-color:#b42b26;font-weight:bold;box-shadow:0 0 12px #f22a2a55,inset 0 1px #fff4;font-size:17px}
.progressrow{display:flex;align-items:center;gap:12px;margin-top:18px;font:15px "Courier New",monospace}
.progress{height:9px;flex:1;border:1px solid #626b71;border-radius:10px;background:#050607;box-shadow:inset 0 2px 4px #000;overflow:hidden}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#c36b0d,#ffce55);box-shadow:0 0 8px #ff9d16}
.spectrum{height:142px;border:1px solid #626a70;border-radius:13px;padding:9px 12px 7px;background:linear-gradient(#0c0e10,#030405);box-shadow:inset 0 2px 10px #000d,inset 0 1px #fff2}
.shead{display:flex;justify-content:space-between;font:10px "Courier New",monospace;letter-spacing:1.5px;color:#c1c7ca;margin-bottom:4px}.shead b{color:#ffbc42}
#spectrum{width:100%;height:112px;display:block}
.instrumentrow{display:grid;grid-template-columns:1fr 1fr 150px 1.25fr;gap:9px;min-height:150px}
.instrument{border:1px solid #70787e;border-radius:12px;background:linear-gradient(145deg,#42484c,#15191c 65%,#33393d);box-shadow:inset 0 1px #fff4,inset 0 -2px #000b,0 3px 7px #0009;padding:7px;min-width:0}
.vubox{position:relative;overflow:hidden;background:linear-gradient(#1a1b19,#070807 70%,#2d1a08)}
.vubox:before{content:"";position:absolute;inset:4px;border:1px solid #b28a45;border-radius:8px;pointer-events:none}
.vutitle{text-align:center;color:#ffdc8c;font:10px Georgia,serif;letter-spacing:1.4px}
.gauge{height:119px;position:relative}.gauge svg{width:100%;height:100%}
.needle{transform-origin:50% 88%;transition:transform .17s ease}
.tubes{display:flex;justify-content:center;align-items:center;gap:13px;padding:10px}
.tube{width:44px;height:118px;border:2px solid #8a9294;border-radius:45% 45% 22% 22%;background:linear-gradient(90deg,#101314,#9b5a19 28%,#fff0a4 49%,#bd6719 65%,#101314);position:relative;box-shadow:0 0 13px #ff941e66,inset 0 0 12px #000}
.tube:before{content:"";position:absolute;left:8px;right:8px;top:17px;bottom:17px;border:1px solid #ffdf8d;border-radius:45%;box-shadow:0 0 13px #ff8d1c;animation:glow 1.5s ease-in-out infinite alternate}
.tube:after{content:"";position:absolute;bottom:6px;left:5px;right:5px;height:9px;background:#e49a31;box-shadow:0 0 9px #ff941c}
@keyframes glow{to{opacity:.4;filter:brightness(1.8)}}
.eqbox{padding:8px 9px}.eqtitle{text-align:center;font:10px "Courier New";color:#e4e7e9;letter-spacing:1px}
.eqsliders{height:116px;display:flex;align-items:end;justify-content:space-around;gap:4px;padding-top:7px}
.eqcol{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:4px}
.eqrail{height:91px;width:9px;border-radius:7px;background:linear-gradient(90deg,#080a0b,#555e64,#080a0b);border:1px solid #6e777c;position:relative}
.eqknob{position:absolute;left:50%;top:var(--y);transform:translate(-50%,-50%);width:18px;height:13px;border-radius:3px;background:linear-gradient(#fff,#c4cbd0 30%,#616a70 90%);border:1px solid #f5f5f5;box-shadow:0 2px 3px #000}
.eqlabel{font:8px Arial;color:#c1c7ca}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 8px;border:1px solid #687177;border-radius:12px;background:linear-gradient(#3a4044,#121619);box-shadow:inset 0 1px #fff3,inset 0 -2px #000c}
.ctrl{width:60px;height:58px;border:1px solid #b7bec2;border-radius:10px;background:linear-gradient(180deg,#f2f4f5 0%,#b7c0c5 22%,#626b71 55%,#242a2e 100%);color:#111619;box-shadow:inset 0 1px #fff, inset 0 -2px #24292c,0 3px 6px #000b;display:grid;place-items:center;transition:transform .1s,filter .1s}
.ctrl svg{width:25px;height:25px;fill:currentColor}.ctrl:active{transform:translateY(2px);filter:brightness(.78)}
.ctrl.play{width:70px;height:68px;border-radius:50%;border:2px solid #ffdb91;background:radial-gradient(circle at 38% 25%,#ffe7a6,#e28b15 57%,#6c3500);color:#241507;box-shadow:0 0 0 3px #40250b,0 0 19px #ff991b99,inset 0 2px #fff9,0 4px 6px #000d}
.vol{display:flex;align-items:center;gap:9px;margin-left:14px;min-width:190px;font-size:13px;color:#e2e5e7}.vol input{width:125px;accent-color:#ffad27}
.status{min-height:15px;text-align:center;font-size:10px;color:#aeb6bb}
.library{padding:10px;display:flex;flex-direction:column;min-width:0;min-height:0}
.libtop{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.tab{padding:12px 5px;border:1px solid #6b747a;border-radius:9px;background:linear-gradient(#343a3e,#121619);box-shadow:inset 0 1px #fff4;font-size:13px}
.tab.active{background:linear-gradient(#ffc24e,#9c5008);color:#241605;border-color:#ffcf76;box-shadow:inset 0 1px #fff9,0 0 10px #ff9d1655}
.search{width:100%;margin:10px 0;padding:12px 13px;border:1px solid #687177;border-radius:8px;background:#060809;color:#fff;box-shadow:inset 0 2px 5px #000c;outline:none;font-size:14px}
.libbody{display:grid;grid-template-columns:190px minmax(0,1fr);gap:8px;min-height:0;flex:1}
.filters{display:flex;flex-direction:column;gap:4px;max-height:670px;overflow:auto;padding-right:2px}
.filter{display:flex;align-items:center;gap:8px;padding:9px 8px;border:1px solid #424a4f;border-radius:7px;background:linear-gradient(#242a2e,#121619);color:#e2e5e7;text-align:left;font-size:12px}
.filter.active{background:linear-gradient(#ffc04a,#995009);border-color:#ffcf76;color:#241605;box-shadow:0 0 8px #ff9d1644}
.filter .flag{font-size:17px}.filter .count{margin-left:auto;opacity:.8}
.genrehead{padding:11px 4px 4px;color:#ffbf51;font:10px "Courier New";letter-spacing:1.3px}
.stations{display:flex;flex-direction:column;gap:4px;max-height:720px;overflow:auto;padding-right:4px}
.station{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px;border:1px solid #485157;border-radius:8px;background:linear-gradient(90deg,#252b2f,#111619);text-align:left;min-width:0;transition:border-color .15s,background .15s}
.station:hover{background:linear-gradient(90deg,#353c41,#1b2125)}
.station.active{border-color:#ffb333;background:linear-gradient(90deg,#6b390d,#252018 75%);box-shadow:inset 0 0 0 1px #ffcb5c66,0 0 8px #ff9d1633}
.stationlogo{width:54px;height:44px;flex:none;border-radius:7px;display:grid;place-items:center;background:#080a0c;border:1px solid #727b80;overflow:hidden}
.stationlogo img{width:100%;height:100%;object-fit:contain;background:#fff}
.stationlogo .initial{font-size:17px;font-weight:900;color:#f3f4f5;text-align:center}
.stationinfo{min-width:0;flex:1}.stationname{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stationtag{font-size:11px;color:#b5bdc2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ststate{font:9px "Courier New";color:#9da7ad;white-space:nowrap}
.fav{border:0;background:transparent;color:#aeb8bd;font-size:22px;padding:2px}.fav.on{color:#ffb13a;text-shadow:0 0 8px #ff9d16}
.bottomnav{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px;border:1px solid #70787d;border-radius:14px;background:linear-gradient(#33393d,#111518);box-shadow:inset 0 1px #fff4,0 4px 10px #0008;overflow-x:auto}
.navbtn{display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;padding:11px 15px;border:1px solid #646d73;border-radius:9px;background:linear-gradient(#373d41,#111619);box-shadow:inset 0 1px #fff4,0 2px 4px #0008;font-size:13px}
.navbtn.active{background:linear-gradient(#ffc14a,#9b5108);color:#211506;border-color:#ffcf76;box-shadow:0 0 10px #ff9d1655}
.navbtn.round{width:58px;height:54px;padding:0;font-size:24px}
.navspacer{flex:1}
.empty{padding:20px;color:#b7bec3;text-align:center;font-size:13px}
@media(max-width:1100px){.workspace{grid-template-columns:minmax(0,1.15fr) minmax(390px,1fr)}.now{grid-template-columns:190px minmax(0,1fr)}.cover{height:175px}.instrumentrow{grid-template-columns:1fr 1fr 115px}.eqbox{grid-column:1/-1}.eqsliders{height:85px}.eqrail{height:62px}.library .libbody{grid-template-columns:135px minmax(0,1fr)}.filter{font-size:11px}}
@media(max-width:820px){body{padding:5px}.top{height:auto;min-height:68px;flex-wrap:wrap}.topmeta{width:100%;justify-content:space-between}.workspace{grid-template-columns:1fr}.library{min-height:650px}.player{min-height:0}.bottomnav{margin-top:8px}.instrumentrow{grid-template-columns:1fr 1fr 120px 1.2fr}.eqbox{grid-column:auto}}
@media(max-width:560px){.brand{font-size:27px}.ecg,.topdivider,.toplabel{display:none}.meta{padding:5px 7px}.now{grid-template-columns:110px minmax(0,1fr);gap:10px}.cover{height:122px}.cover .fallback{font-size:38px}.trackname{font-size:22px}.tracktag{font-size:13px}.badges{margin-top:8px;gap:5px}.badge{padding:5px 8px;font-size:11px}.badge.live{font-size:12px}.progressrow{margin-top:9px;font-size:12px}.spectrum{height:112px}#spectrum{height:82px}.instrumentrow{grid-template-columns:1fr 1fr}.tubes{min-height:120px}.eqbox{grid-column:1/-1}.controls{gap:6px;flex-wrap:wrap}.ctrl{width:48px;height:48px}.ctrl.play{width:58px;height:58px}.vol{margin:7px 0 0;min-width:100%;justify-content:center}.libbody{grid-template-columns:115px minmax(0,1fr)}.filter{padding:7px 5px;font-size:10px}.station{min-height:52px;gap:6px;padding:5px}.stationlogo{width:42px;height:38px}.stationname{font-size:12px}.stationtag{font-size:10px}.ststate{display:none}.navbtn{padding:9px 10px}.navbtn.round{width:46px;height:44px}}
/* Светлая тема: тот же макет, сатиновый алюминий */
body[data-theme="light"]{color-scheme:light;--text:#202326;--muted:#596168;background:radial-gradient(ellipse at 50% -15%,#fff 0,#dce0e2 48%,#aeb5ba 100%);color:#202326}
body[data-theme="light"] .metal,body[data-theme="light"] .instrument,body[data-theme="light"] .controls,body[data-theme="light"] .bottomnav{background:linear-gradient(155deg,#f7f8f8,#c4cbd0 30%,#e9edef 68%,#aeb6bb);border-color:#8b959b;box-shadow:inset 0 1px #fff, inset 0 -2px #899197,0 5px 13px #68727a55}
body[data-theme="light"] .brand,body[data-theme="light"] .trackname{color:#1c2226;text-shadow:0 1px #fff}
body[data-theme="light"] .toplabel,body[data-theme="light"] .tracktag,body[data-theme="light"] .progressrow{color:#30383d}
body[data-theme="light"] .meta,body[data-theme="light"] .theme,body[data-theme="light"] .windowbtn,body[data-theme="light"] .badge,body[data-theme="light"] .tab,body[data-theme="light"] .filter,body[data-theme="light"] .navbtn{background:linear-gradient(#f8fafb,#c1c9ce);color:#222a2f;border-color:#8c969c;box-shadow:inset 0 1px #fff,0 2px 4px #77818855}
body[data-theme="light"] .theme button.active,body[data-theme="light"] .tab.active,body[data-theme="light"] .filter.active,body[data-theme="light"] .navbtn.active{background:linear-gradient(#ffcf76,#d88819);color:#281905}
body[data-theme="light"] .cover{background:radial-gradient(circle at 50% 25%,#f8fafb,#9ca6ac 80%);border-color:#879197}
body[data-theme="light"] .station{background:linear-gradient(90deg,#f5f7f8,#d7dde0);border-color:#a1aaaf;color:#20272b}
body[data-theme="light"] .station:hover{background:linear-gradient(90deg,#fff,#e5eaed)}
body[data-theme="light"] .station.active{background:linear-gradient(90deg,#ffdda0,#f1c77f);border-color:#d28a25}
body[data-theme="light"] .stationtag,body[data-theme="light"] .ststate,body[data-theme="light"] .filter .count,body[data-theme="light"] .brand small,body[data-theme="light"] .status{color:#59636a}
body[data-theme="light"] .search{background:#fff;color:#202326;border-color:#9ba5ab;box-shadow:inset 0 1px 4px #89949b55}
body[data-theme="light"] .vubox{background:linear-gradient(#f2e6c6,#4e351d 80%,#bd8b3e)}
body[data-theme="light"] .spectrum{border-color:#89949a}
body[data-theme="light"] .stationlogo{background:#fff}
body[data-theme="light"] .badge.live{color:#bd211c;background:linear-gradient(#fff,#e5dada)}
body[data-theme="light"] .vol{color:#30383d}
body[data-theme="light"] .ctrl{border-color:#9aa3a8;background:linear-gradient(#fff,#b7c0c5 35%,#6e787e 100%)}
body[data-theme="light"] .ctrl.play{background:radial-gradient(circle at 38% 25%,#fff0bd,#e18a16 57%,#8a4800);color:#241507}
body[data-theme="light"] .filter{color:#252c31}

/* RADIO MAY — reference layout: full-width Hi-Fi deck + compact station browser */
.workspace{grid-template-columns:minmax(0,2fr) minmax(420px,1fr);gap:10px}
.player{gap:10px;padding:12px}
.library{padding:10px;min-height:0}
.libbody{display:block;min-height:0;flex:1}
.filters{display:none!important}
.stations{max-height:none;height:100%;min-height:0;overflow:auto;gap:2px;padding:2px 5px 2px 2px}
.station{min-height:61px;padding:5px 9px;gap:12px;border-radius:2px;border-width:0 0 1px 0;background:linear-gradient(90deg,#171a1d,#090b0d);border-color:#50565b}
.station:hover{background:linear-gradient(90deg,#303438,#15191c)}
.station.active{border:1px solid #ffb52b;border-radius:8px;background:linear-gradient(90deg,#6c3909,#25190b 80%);box-shadow:inset 0 0 0 1px #ffcc6866,0 0 10px #ff9d1655}
.stationlogo{width:94px;height:52px;border-radius:8px;background:#050607;border:1px solid #6e7479;box-shadow:inset 0 1px #fff4,0 2px 4px #0009}
.stationlogo img{object-fit:contain;padding:2px}
.stationinfo{min-width:0}
.stationname{font-size:17px;line-height:1.15}
.stationtag{font-size:13px;margin-top:4px}
.ststate{font-size:10px;letter-spacing:.5px}
.fav{font-size:25px;padding:3px 7px}
.libtop{grid-template-columns:1fr 1fr auto;gap:8px}
.tab{font-size:15px;padding:13px 8px}
.search{margin:10px 0 9px;padding:13px 14px;font-size:15px}
.now{grid-template-columns:260px minmax(0,1fr);gap:20px;padding:4px 7px 7px}
.cover{height:218px}
.trackname{font-size:clamp(29px,2.8vw,43px)}
.tracktag{font-size:clamp(17px,1.7vw,23px)}
.badges{margin-top:17px}
.spectrum{height:142px;padding:9px 13px 7px}
#spectrum{height:112px}
.instrumentrow{grid-template-columns:1fr 1fr 150px 1.25fr;min-height:166px;gap:9px}
.gauge{height:132px}
.tube{height:128px;width:47px}
.eqsliders{height:128px}
.eqrail{height:99px}
.controls{min-height:96px;gap:11px;padding:10px 12px}

.ctrl.play{width:78px;height:78px}

 .workspace{grid-template-columns:minmax(0,1.65fr) minmax(360px,1fr)}
 .now{grid-template-columns:190px minmax(0,1fr)}

 .stationlogo{width:72px;height:46px}

/* Light skin retains the same exact geometry */
body[data-theme="light"] .station{border-color:#9da6ab;background:linear-gradient(90deg,#f4f6f7,#d5dce0)}

/* RADIO MAY · REFERENCE SKIN v1.5 */
html,body{min-height:100%;height:100%}
body{padding:8px}
.app{width:min(100%,1780px);margin:0 auto}
.top{height:68px;padding:7px 18px;gap:16px}
.brand{font-size:clamp(25px,2.65vw,39px)}
.brandicon{display:none}
.brand small{letter-spacing:2.1px}
.ecg{width:58px;height:30px}
.toplabel{font-size:17px}
.topmeta{gap:7px}
.meta{padding:6px 9px}
.workspace{grid-template-columns:minmax(0,2.08fr) minmax(340px,.98fr);gap:9px;margin-top:9px;align-items:stretch;min-height:calc(100vh - 94px)}
.player{padding:11px;gap:9px;min-height:0}
.now{grid-template-columns:180px minmax(0,1fr);gap:16px;padding:1px 5px 6px}
.cover{height:142px;border-radius:15px}
.cover img{width:92%;height:92%;object-fit:contain}
.trackname{font-size:clamp(25px,2.5vw,37px)}
.tracktag{font-size:clamp(15px,1.5vw,21px)}
.badges{margin-top:11px;gap:8px}
.badge{padding:7px 13px;font-size:13px}
.badge.live{font-size:16px}
.progressrow{margin-top:11px}
.meters-spectrum{display:grid;grid-template-columns:minmax(150px,.82fr) minmax(150px,.82fr) minmax(260px,1.55fr);gap:8px;min-height:150px}
.instrument.vubox{padding:7px 7px 3px;border-radius:12px}
.vutitle{font-size:10px;letter-spacing:1.2px}
.gauge{height:116px}
.spectrum{height:150px;padding:8px 10px 6px;border-radius:12px;min-width:0}
#spectrum{height:116px}
.controls{min-height:70px;gap:9px;padding:8px 10px}
.ctrl{width:58px;height:54px;border-radius:9px}
.ctrl svg{width:24px;height:24px}
.ctrl.play{width:68px;height:62px;border-radius:50%}
.vol{margin-left:8px;min-width:175px}
.vol input{width:115px}
.status{min-height:13px}
.library{padding:9px;min-height:0;overflow:hidden}
.libtop{grid-template-columns:1fr 1fr 1fr;gap:6px}
.tab{padding:10px 4px;font-size:13px}
.search{margin:9px 0;padding:10px 12px}
.libbody{display:block;min-height:0;flex:1}
.filters{display:none!important}
.stations{max-height:calc(100vh - 215px);height:100%;gap:2px;padding-right:4px}
.station{min-height:47px;padding:4px 7px;gap:9px;border-radius:5px;background:linear-gradient(90deg,#1c2023,#111416);border-color:#4d555a}
.stationlogo{width:62px;height:35px;border-radius:5px}
.stationlogo img{object-fit:contain}
.stationname{font-size:14px}
.stationtag{font-size:10px}
.ststate{font-size:9px}
.fav{font-size:20px}
.bottomnav{display:none!important}
.instrument.tubes,.instrument.eqbox{display:none!important}
body:not([data-theme="light"]) .player,body:not([data-theme="light"]) .library{background:linear-gradient(145deg,#292d30 0%,#111416 48%,#252a2e 100%)}
body:not([data-theme="light"]) .workspace .metal{border-color:#747d82}
body:not([data-theme="light"]) .station.active{background:linear-gradient(90deg,#74410e,#30251a 76%);border-color:#ffb83e;box-shadow:inset 0 0 0 1px #ffca6b77,0 0 9px #ff9d1644}

body[data-theme="light"]{background:radial-gradient(ellipse at 50% -20%,#fff 0,#e4e8ea 46%,#b9c0c5 100%)}

body[data-theme="light"] .top{background:linear-gradient(#f9fbfc,#c1c9ce 55%,#e8ecee)}

body[data-theme="light"] .brand small{color:#4d565c}

@media(max-width:1050px){
 .workspace{grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr)}
 .now{grid-template-columns:145px minmax(0,1fr)}
 .cover{height:130px}

 .gauge{height:104px}
 .stations{max-height:calc(100vh - 205px)}
}

 body{padding:5px}

}

const $=s=>document.querySelector(s), audio=$("#audio");
let selected=null,active=false,hls=null,tab="stations",country="Все страны";
let favorites=new Set(JSON.parse(localStorage.getItem("radioMayFavs")||"[]"));
let history=JSON.parse(localStorage.getItem("radioMayHistory")||"[]");
const countries=[["Все страны","🌐"],["Россия","🇷🇺"],["Великобритания","🇬🇧"],["США","🇺🇸"],["Германия","🇩🇪"],["Франция","🇫🇷"],["Швейцария","🇨🇭"]];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function logoUrl(s){return "https://www.google.com/s2/favicons?domain="+encodeURIComponent(s.domain||"")+"&sz=128"}
function logoNode(s){let d=document.createElement("div");d.className="stationlogo";let im=document.createElement("img");im.loading="lazy";im.src=logoUrl(s);im.alt="";im.onerror=()=>{d.innerHTML='<span class="initial">'+esc(s.name.split(/\s+/).slice(0,2).map(v=>v[0]).join("").toUpperCase())+'</span>'};d.append(im);return d}
function currentItems(){
 const rank=["record", "maximum", "pioneer", "europa", "dfm", "marusya", "love", "comedy", "zaycev", "record-russian", "record-90", "record-rock", "record-chill", "record-deep", "record-trance", "montecarlo", "nashe", "retro", "rusradio", "vanya", "mixadance", "business", "bbc1", "bbc2", "capital", "heart80", "bbcworld", "kexp", "wfmu", "somafm", "somadrone", "deutschlandfunk", "fip", "franceinter", "m2hits", "m2rock", "swissjazz", "80s80s"]; let list=[...STATIONS].sort((a,b)=>{const ai=rank.indexOf(a.id),bi=rank.indexOf(b.id);return (ai<0?999:ai)-(bi<0?999:bi)});
 if(tab==="favorites")list=list.filter(s=>favorites.has(s.id));
 if(tab==="history")list=history.map(id=>STATIONS.find(s=>s.id===id)).filter(Boolean);
 if(tab==="stations"&&country!=="Все страны"&&country!=="Ещё")list=list.filter(s=>s.country===country);
 const q=$("#search").value.trim().toLowerCase();
 if(q)list=list.filter(s=>(s.name+" "+s.tagline+" "+s.genre+" "+s.country).toLowerCase().includes(q));
 return list;
}
function renderFilters(){
 const el=$("#filters");el.innerHTML="";
 countries.forEach(([name,flag])=>{const count=name==="Все страны"?STATIONS.length:STATIONS.filter(s=>s.country===name).length;const b=document.createElement("button");b.className="filter"+(country===name?" active":"");b.innerHTML='<span class="flag">'+flag+'</span><span>'+esc(name)+'</span><span class="count">'+count+'</span>';b.onclick=()=>{country=name;tab="stations";document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));renderFilters();renderStations();syncBottom()};el.append(b)});
 const h=document.createElement("div");h.className="genrehead";h.textContent="ЖАНРЫ";el.append(h);
 [...new Set(STATIONS.map(s=>s.genre))].sort((a,b)=>a.localeCompare(b,"ru")).forEach(g=>{const b=document.createElement("button");b.className="filter";b.textContent="♫ "+g;b.onclick=()=>{$("#search").value=g;tab="stations";renderStations()};el.append(b)});
}
function renderStations(){
 const el=$("#stations");el.innerHTML="";const items=currentItems();
 if(!items.length){el.innerHTML='<div class="empty">Станции не найдены</div>';return}
 items.forEach(s=>{
  const row=document.createElement("button");row.className="station"+(selected?.id===s.id?" active":"");
  row.append(logoNode(s));
  const info=document.createElement("span");info.className="stationinfo";
  const nm=document.createElement("span");nm.className="stationname";nm.textContent=s.name;
  const tg=document.createElement("span");tg.className="stationtag";tg.textContent=s.tagline;
  info.append(nm,tg);row.append(info);
  const st=document.createElement("span");st.className="ststate";st.textContent=active&&selected?.id===s.id?"LIVE":"RADIO";row.append(st);
  const fav=document.createElement("span");fav.className="fav"+(favorites.has(s.id)?" on":"");fav.textContent=favorites.has(s.id)?"★":"☆";fav.title="Избранное";fav.onclick=e=>{e.stopPropagation();toggleFav(s);};row.append(fav);
  row.onclick=()=>{selectStation(s);play()};el.append(row);
 });
}
function syncBottom(){document.querySelectorAll(".bottomnav [data-country]").forEach(b=>b.classList.toggle("active",b.dataset.country===country||(b.dataset.country==="Ещё"&&!countries.some(c=>c[0]===country))))}
function toggleFav(s){if(favorites.has(s.id))favorites.delete(s.id);else favorites.add(s.id);localStorage.setItem("radioMayFavs",JSON.stringify([...favorites]));renderStations();$("#favCurrent").style.color=selected&&favorites.has(selected.id)?"#ffb13a":""}
function selectStation(s){
 selected=s;$("#trackName").textContent=s.name;$("#trackDesc").textContent=s.tagline;$("#quality").textContent="◉ LIVE STREAM";$("#format").textContent=s.country+" · "+s.genre;$("#live").textContent="● READY";
 const cover=$("#cover");cover.innerHTML="";const im=document.createElement("img");im.src=logoUrl(s);im.alt=s.name;im.onerror=()=>{cover.innerHTML='<div class="fallback">'+esc(s.name.split(/\s+/).slice(0,2).map(v=>v[0]).join("").toUpperCase())+'</div>'};cover.append(im);
 history=[s.id,...history.filter(x=>x!==s.id)].slice(0,30);localStorage.setItem("radioMayHistory",JSON.stringify(history));
 $("#status").textContent="Станция выбрана. Подключаю эфир…";$("#favCurrent").style.color=favorites.has(s.id)?"#ffb13a":"";renderStations();
}
async function loadSource(src){
 if(hls){hls.destroy();hls=null}audio.pause();audio.removeAttribute("src");audio.load();
 if(src.includes(".m3u8")&&!audio.canPlayType("application/vnd.apple.mpegurl")&&window.Hls&&Hls.isSupported()){
  hls=new Hls({enableWorker:true});hls.loadSource(src);hls.attachMedia(audio);
  await new Promise((res,rej)=>{hls.once(Hls.Events.MANIFEST_PARSED,res);hls.once(Hls.Events.ERROR,(e,d)=>{if(d.fatal)rej(Error("HLS error"))})});
 }else{audio.src=src;audio.load()}
 await audio.play();
}
async function play(){
 if(!selected){$("#status").textContent="Сначала выбери станцию в списке.";return}
 const urls=[selected.stream,...(selected.fallback||[])].filter(Boolean);$("#status").textContent="Подключаюсь к "+selected.name+"…";$("#live").textContent="● CONNECT";
 for(const url of urls){try{await loadSource(url);active=true;$("#live").textContent="● LIVE";$("#specState").textContent="48 BAND · ON AIR";$("#play").innerHTML='<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>';$("#status").textContent="Эфир подключён.";renderStations();return}catch(e){if(hls){hls.destroy();hls=null}audio.pause();audio.removeAttribute("src");audio.load()}}
 active=false;$("#live").textContent="● ERROR";$("#status").textContent="Поток не открылся. Возможно, станция сменила адрес или ограничила воспроизведение.";renderStations();
}
function stop(){audio.pause();audio.removeAttribute("src");audio.load();if(hls){hls.destroy();hls=null}active=false;$("#live").textContent="● READY";$("#specState").textContent="48 BAND · STANDBY";$("#play").innerHTML='<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';$("#status").textContent="Воспроизведение остановлено.";renderStations()}
function step(dir){let list=currentItems();if(!list.length)list=STATIONS;if(!selected){selectStation(list[0]);play();return}let i=list.findIndex(s=>s.id===selected.id);let next=list[(i+dir+list.length)%list.length];selectStation(next);play()}
$("#showStations").onclick=()=>$("#stations").scrollIntoView({block:"nearest",behavior:"smooth"});
const showEqButton=$("#showEq");if(showEqButton)showEqButton.onclick=()=>{$(".eqbox")?.classList.toggle("eq-hidden")};
$("#play").onclick=()=>{
 if(active && !audio.paused){audio.pause();active=false;$("#live").textContent="● PAUSE";$("#specState").textContent="48 BAND · PAUSE";$("#status").textContent="Пауза.";$("#play").innerHTML='<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>';renderStations();}
 else {play();}
};$("#stop").onclick=stop;$("#prev").onclick=()=>step(-1);$("#next").onclick=()=>step(1);
$("#volume").oninput=e=>{audio.volume=+e.target.value;$("#vol").textContent=Math.round(audio.volume*100)+"%"};audio.volume=.8;
$("#favCurrent").onclick=()=>{if(selected)toggleFav(selected)};
$("#search").oninput=renderStations;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 if(b.dataset.tab==="search"){ $("#search").focus(); $("#search").scrollIntoView({block:"nearest",behavior:"smooth"}); return; }
 tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));renderStations()
});
document.querySelectorAll(".bottomnav [data-country]").forEach(b=>b.onclick=()=>{if(b.dataset.country==="Ещё"){country=country==="Италия"?"Все страны":"Италия"}else country=b.dataset.country;tab="stations";document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));renderFilters();renderStations();syncBottom()});
$("#darkBtn").onclick=()=>setTheme("dark");$("#lightBtn").onclick=()=>setTheme("light");
function setTheme(t){document.body.dataset.theme=t;$("#darkBtn").classList.toggle("active",t==="dark");$("#lightBtn").classList.toggle("active",t==="light");localStorage.setItem("radioMayTheme",t);document.querySelector('meta[name="theme-color"]').content=t==="dark"?"#101214":"#dce0e2"}
setTheme(localStorage.getItem("radioMayTheme")||"dark");
$("#about").onclick=()=>alert("Радио Май — независимый интернет-радиоплеер. Потоки и логотипы предоставляются вещателями и могут меняться.");
$("#settings").onclick=()=>{const c=prompt("Город для погоды:",localStorage.getItem("radioMayCity")||"Воронеж");if(c){localStorage.setItem("radioMayCity",c);weather(c)}};
function tickClock(){const d=new Date();$("#clock").textContent=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});$("#date").textContent=d.toLocaleDateString("ru-RU",{weekday:"short",day:"2-digit",month:"short"}).toUpperCase()}tickClock();setInterval(tickClock,1000);
async function weather(city="Воронеж"){try{const g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1&language=ru&format=json");const p=(await g.json()).results?.[0];if(!p)throw Error();const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,weather_code&timezone=auto`);const c=(await r.json()).current;const codes={0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",61:"🌧️",63:"🌧️",65:"🌧️",71:"🌨️",80:"🌦️",95:"⛈️"};$("#city").textContent=p.name;$("#weatherTemp").textContent=Math.round(c.temperature_2m)+"°C";$("#wxicon").textContent=codes[c.weather_code]||"🌤️";$("#weatherText").textContent=p.name}catch(e){$("#weatherTemp").textContent="—°C";$("#weatherText").textContent="погода недоступна"}}
weather(localStorage.getItem("radioMayCity")||"Воронеж");$("#weather").onclick=()=>{const c=prompt("Город для погоды:",localStorage.getItem("radioMayCity")||"Воронеж");if(c){localStorage.setItem("radioMayCity",c);weather(c)}};
const eqSliders=$("#eqSliders");if(eqSliders){const eqLabels=["60","170","310","600","1K","3K","6K","12K","16K"];eqSliders.innerHTML=eqLabels.map((x,i)=>`<div class="eqcol"><div class="eqrail"><i class="eqknob" style="--y:${[57,44,35,25,18,29,42,33,22][i]}%"></i></div><span class="eqlabel">${x}</span></div>`).join("");}
const canvas=$("#spectrum"),ctx=canvas.getContext("2d");let phase=0;
function drawSpectrum(){requestAnimationFrame(drawSpectrum);const w=canvas.width=canvas.clientWidth*devicePixelRatio,h=canvas.height=canvas.clientHeight*devicePixelRatio;ctx.clearRect(0,0,w,h);ctx.fillStyle="#050607";ctx.fillRect(0,0,w,h);ctx.strokeStyle="#ffffff16";ctx.lineWidth=devicePixelRatio;for(let y=12*devicePixelRatio;y<h;y+=18*devicePixelRatio){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}phase+=active?.12:.025;const n=48,g=4*devicePixelRatio,bw=(w-g*(n-1))/n;for(let i=0;i<n;i++){const a=active?.12+.84*Math.abs(Math.sin(phase+i*.31)*Math.cos(phase*.43+i*.12)):.025;const bh=a*(h-8*devicePixelRatio),y=h-bh;const gr=ctx.createLinearGradient(0,y,0,h);gr.addColorStop(0,"#f02e24");gr.addColorStop(.42,"#ffb52d");gr.addColorStop(1,"#51d337");ctx.fillStyle=gr;ctx.fillRect(i*(bw+g),y,bw,bh)}}drawSpectrum();
function animateMeters(){const t=performance.now()/1000;const l=active?(-38+36*Math.abs(Math.sin(t*2.2))):(-66),r=active?(-38+36*Math.abs(Math.sin(t*1.8+1))):(-66);$("#needleL").style.transform=`rotate(${l}deg)`;$("#needleR").style.transform=`rotate(${r}deg)`;requestAnimationFrame(animateMeters)}animateMeters();
renderFilters();renderStations();syncBottom();
